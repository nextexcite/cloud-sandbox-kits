# syntax=docker/sandbox-kit:3.0.0-m.13@sha256:922fd778877714b2353de978c4993b81fe2e1908793630205eedbd7229ca0a1f
schemaVersion: "3"
kind: workload
displayName: Claude Code Factory v3
description: Claude Code with the shared development toolchains and default approvals.
sourceUrl: https://github.com/nextexcite/sbx-agent-kits
version: "${{ kit.args.version }}"
args:
  base_image:
    default: docker.io/sbx/shell-docker-image:latest
    description: Base image providing the agent user and sandbox environment
    buildArg: BASE_IMAGE
  version:
    default: "2.1.316"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Claude Code release to install
    buildArg: CLAUDE_VERSION
provides: ["claude@${{ kit.args.version }}"]
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/dockerd@1
    optional: true
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com:443
          - platform.claude.com:443
          - downloads.claude.ai:443
          - claude.com:443
          - mcp-proxy.anthropic.com:443
          - bridge.claudeusercontent.com:443
          - github.com:443
          - api.github.com:443
          - '*.githubusercontent.com:443'
          - registry.npmjs.org:443
          - nodejs.org:443
          - pypi.org:443
          - files.pythonhosted.org:443
  - type: com.docker.sandbox/credential@1
    name: Anthropic access
    optional: true
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: "%s"}
          - {domain: mcp-proxy.anthropic.com, header: x-api-key, format: "%s"}
      oauth:
        tokenEndpoint: {host: platform.claude.com, path: /v1/oauth/token}
        sentinels:
          accessToken: sk-ant-oat01-proxy-managed
          refreshToken: sk-ant-ort01-proxy-managed
        credentialFile:
          path: ~/.claude/.credentials.json
          structure:
            claudeAiOauth:
              accessToken: "{{.AccessToken}}"
              refreshToken: "{{.RefreshToken}}"
              expiresAt: "{{.ExpiresAt}}"
              scopes: "{{.Scopes}}"
            primaryApiKey: "{{.PrimaryApiKey}}"
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -e
            python3 - <<'PY'
            import json, os
            from pathlib import Path
            workspace = os.environ.get("WORKSPACE_DIR") or "/"
            Path("/home/agent/.claude.json").write_text(json.dumps({
                "hasCompletedOnboarding": True,
                "projects": {workspace: {"hasTrustDialogAccepted": True}},
            }) + "\n")
            PY
            mkdir -p /home/agent/.claude
            chown agent:agent /home/agent/.claude.json /home/agent/.claude
          user: "0"
          env: [WORKSPACE_DIR]
          description: Seed onboarding and workspace trust without changing approvals
        - command: |
            set -e
            python3 - <<'PY'
            import json, os
            from pathlib import Path
            settings = {}
            if (os.environ.get("SBX_CRED_ANTHROPIC_MODE") or "none") != "none":
                settings["apiKeyHelper"] = "echo proxy-managed"
            Path("/home/agent/.claude/settings.json").write_text(json.dumps(settings) + "\n")
            PY
          user: agent
          env: [SBX_CRED_ANTHROPIC_MODE]
          description: Seed Claude auth helper from the surfaced credential mode
  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config:
      path: /home/agent/.claude/skills
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: CLAUDE.md
      directory: /home/agent/.claude
      contentFile: ./claude-context.md
dockerfile: claude.dockerfile
