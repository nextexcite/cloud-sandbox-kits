name: Instabox Android instrumentation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: instabox-android-instrumentation
  cancel-in-progress: false
jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: instabox-android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run connected tests on Instabox
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE_ID: ${{ vars.INSTABOX_MACHINE_ID }}
        run: bash kits/instabox-android/instrumentation/run-instabox.sh "$RUNNER_TEMP/android-junit.xml"
      - name: Upload JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-instrumentation-junit
          path: ${{ runner.temp }}/android-junit.xml
          if-no-files-found: warn
