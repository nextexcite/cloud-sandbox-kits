name: Reference checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate source and stage examples
        run: bash scripts/check.sh
      - name: Verify Android overlay contents
        shell: bash
        run: |
          docker build -f kits/instabox-android/Dockerfile -t instabox-android-overlay:ci .
          docker image inspect instabox-android-overlay:ci --format '{{json .Config.Labels}}' |
            jq -e '.["org.opencontainers.image.source"] == "https://github.com/nextexcite/sbx-agent-kits" and .["org.opencontainers.image.licenses"] == "Apache-2.0"'

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          docker image save -o "$work/overlay.tar" instabox-android-overlay:ci
          # A scratch overlay has one payload layer; inspect it without creating a container.
          layer=$(tar -xOf "$work/overlay.tar" manifest.json |
            jq -er '.[0].Layers | if length == 1 then .[0] else error("Expected one overlay layer") end')

          mkdir -p "$work/actual" "$work/expected/instabox-android"
          tar -xOf "$work/overlay.tar" "$layer" | tar -xf - -C "$work/actual"
          cp LICENSE kits/instabox-android/{README.md,mise.toml,setup.sh,justfile} "$work/expected/instabox-android/"
          diff -qr --no-dereference "$work/expected" "$work/actual"
          bash -n "$work/actual/instabox-android/setup.sh"
  build-v3:
    strategy:
      fail-fast: false
      matrix:
        kit: [amp, codex, browser, media]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build Kit with the Kit frontend
        run: docker buildx build -f kits/v3/${{ matrix.kit }}/${{ matrix.kit }}.yaml kits/v3/${{ matrix.kit }} -t sbx-agent-kits/${{ matrix.kit }}:ci --load
      - name: Verify runtime
        if: matrix.kit == 'amp' || matrix.kit == 'codex'
        run: docker run --rm --entrypoint sbx-agent-kits-verify sbx-agent-kits/${{ matrix.kit }}:ci
      - name: Browser smoke
        if: matrix.kit == 'browser'
        run: docker run --rm --entrypoint browser-smoke sbx-agent-kits/browser:ci
      - name: Media smoke
        if: matrix.kit == 'media'
        run: docker run --rm --network none --entrypoint media-smoke sbx-agent-kits/media:ci
